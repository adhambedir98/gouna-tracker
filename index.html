<style>

    --gap:#4C7A34; --gap-soft:#E9F2E2; --done:#8A8578; --gold:#F2C14E;

  .bignum .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-top:4px}

  .who button.on-mano{background:var(--mano);border-color:var(--mano);color:#fff}
  .who button.on-mazen{background:var(--mazen);border-color:var(--mazen);color:#fff}
  .who button.on-all{background:var(--ink);border-color:var(--ink);color:#fff}

  .days button{flex:1;padding:9px 2px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer}
  .days button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .days .mini{display:block;font-size:9.5px;font-weight:600;opacity:.6;margin-top:1px;font-variant-numeric:tabular-nums}

  .block{background:var(--card);border:1.5px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}

  .blockhead .nowtag{background:var(--gold);color:var(--ink)}

  .tnote{font-size:10.5px;margin-top:2px;color:#9A6A00;font-weight:700}

  .hoursbadge{display:inline-block;margin-top:5px;margin-left:6px;font-size:11px;font-weight:800;color:var(--gap);background:var(--gap-soft);border-radius:14px;padding:3px 9px;font-variant-numeric:tabular-nums}

  .footer{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;padding:9px 16px;font-size:11px;display:flex;justify-content:space-between;align-items:center;z-index:30}

  .pbar.paper{background:var(--paper);margin-top:0}

  .qmsg{font-size:12px;font-weight:700;margin-top:8px;text-align:center;min-height:15px}

  .hoursform{flex-wrap:wrap}
  .hoursform select{flex:1 1 100%;padding:9px;font-size:13px;font-weight:700;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}

</head>

  </div>

    <span class="s-done"><b id="sessdone">0</b> sessions done</span>
  </div>
</header>

<div class="viewswitch">

  <button id="vw-dash" onclick="setView('dashboard')">DASHBOARD</button>
</div>

<div class="who">

  <button id="btn-all" onclick="setWho('all')">ALL<span class="sub">الكل</span></button>
</div>

<div class="days" id="daytabs"></div>
<main id="main"></main>
</div>

<div id="view-dash" style="display:none">
  <div class="dash">
    <div id="dash-stats"></div>

    <div class="dashsec">Quick add — external streams · تسجيل ساعات خارجية</div>
    <div class="qform">
      <label for="q-env">Environment · البيئة</label>

      <label for="q-tag">App task (exact tag) · مهمة الأبلكيشن</label>
      <select id="q-tag"><option value="">— pick environment first —</option></select>
      <div class="row2">
        <div>
          <label for="q-day">Day · اليوم</label>
          <select id="q-day"><option value="pre">Pre-sprint</option><option value="mon">Monday</option><option value="tue">Tuesday</option><option value="wed">Wednesday</option></select>
        </div>
        <div>
          <label for="q-hours">Hours · الساعات</label>
          <input id="q-hours" type="number" inputmode="decimal" step="0.25" min="0" max="12" placeholder="2.0">
        </div>
      </div>
      <label for="q-note">Note (optional) · ملاحظة</label>
      <input id="q-note" type="text" placeholder="e.g. bricklaying — site 2">
      <button onclick="qAdd()">Add hours · سجّل الساعات</button>
      <div class="qmsg" id="q-msg"></div>
    </div>
  </div>
</div>

<div class="footer">
  <span>Live · بيتسجل مباشرة</span>
  <button onclick="loadRemote(true)">↻ Refresh</button>
</div>

function live(ok, msg){
  document.getElementById("livedot").className = "d" + (ok?"":" err");
  document.getElementById("livemsg").textContent = msg;
}
async function loadRemote(manual){
  try{
    const r = await fetch(`${SB_URL}/rest/v1/${T}?select=item_id,day,checked,hours,app_tag`, {headers:H});
    if(!r.ok) throw new Error(r.status);
    const data = await r.json();
    allRows = data;
    rows = {};
    data.forEach(x => rows[x.item_id] = {checked:x.checked, hours:+x.hours});
    live(true, "live");
    renderAll();
  }catch(e){
    live(false, "offline — retrying");
  }
}
async function saveRow(id, checked, hours, dayId, block, person, phone, task, tag){
  rows[id] = {checked, hours};
  const ix = allRows.findIndex(x=>x.item_id===id);
  const rec = {item_id:id, day:dayId, checked, hours, app_tag:tag||null};
  if(ix>=0) allRows[ix] = {...allRows[ix], ...rec}; else allRows.push(rec);
  renderAll();
  try{
    const r = await fetch(`${SB_URL}/rest/v1/${T}?on_conflict=item_id`, {
      method:"POST",
      headers:{...H, "Prefer":"resolution=merge-duplicates,return=minimal"},
      body: JSON.stringify([{item_id:id, day:dayId, block, person, phone, task, app_tag:tag||null, checked, hours, checked_by:person, updated_at:new Date().toISOString()}])
    });
    if(!r.ok) throw new Error(r.status);
    live(true, "live");
  }catch(e){
    live(false, "save failed — tap ↻");
  }
}

function setWho(w){ who=w; openForm=null; render(); }
function setDay(d){ day=d; openForm=null; render(); }
function openHours(id){ openForm = openForm===id ? null : id; render(); }

function confirmHours(id, dayId, block, person, phone, task, tag, dur){
  const inp = document.getElementById("inp-"+id);
  let v = parseFloat(inp.value);
  if(isNaN(v) || v < 0 || v > 4){ inp.style.borderColor="#E5533C"; return; }
  const sel = document.getElementById("tag-"+id);   // present only on FLEX tasks
  if(sel){
    if(!sel.value){ sel.style.borderColor="#E5533C"; return; }
    tag = sel.value;
  }
  openForm = null;
  saveRow(id, true, v, dayId, block, person, phone, task, tag);
}
function uncheck(id, dayId, block, person, phone, task, tag){
  openForm = null;
  saveRow(id, false, 0, dayId, block, person, phone, task, tag);
}

function nowBlock(dayObj, block){
  const map = {mon:1,tue:2,wed:3};
  const n = new Date();
  if(n.getDay() !== map[dayObj.id]) return false;
  const m = block.time && block.time.match(/(\d{2}):(\d{2}) – (\d{2}):(\d{2})/);
  if(!m) return false;
  const cur = n.getHours()*60+n.getMinutes();
  return cur >= (+m[1]*60 + +m[2]) && cur <= (+m[3]*60 + +m[4]);
}

      it.t.forEach((t,ti)=>{
        const id = iid(d.id,bi,it.ph,ti);

        const tag = TAGS[t[4]];

// ---------- DASHBOARD ----------
const fnum = n => String(Math.round(n*100)/100);

function agg(){
  const byTag = {}, byDay = {pre:0,mon:0,tue:0,wed:0};
  let grand = 0;
  allRows.forEach(r=>{
    if(!r.checked) return;
    const h = +r.hours || 0;
    grand += h;
    const k = r.app_tag || "__null";
    byTag[k] = (byTag[k]||0) + h;
    if(byDay[r.day] !== undefined) byDay[r.day] += h;
  });
  return {byTag, byDay, grand};
}

function toggleEnv(id){ openEnvs[id] = !openEnvs[id]; renderDash(); }

function renderDash(){
  const {byTag, byDay, grand} = agg();

  let html = `<div class="grand">
    <div class="n" id="dash-grand">${fnum(grand)}<small> / ${fnum(GRAND_TARGET)}h</small></div>
    <div class="l">Hours collected vs target · الساعات المتجمعة من الهدف</div>
    <div class="pbar"><i class="${grand>=GRAND_TARGET?'full':''}" style="width:${Math.min(100, grand/GRAND_TARGET*100).toFixed(1)}%"></i></div>
  </div>`;

  const cards = ENVS.map(e=>{
    const subsC = e.subs.map(s=>({name:s[0], target:s[1], got: byTag[s[0]]||0}));
    const got = subsC.reduce((a,x)=>a+x.got,0);
    return {id:e.id, name:e.name, loc:e.loc, target:e.target, subsC, got, rem:e.target-got};
  }).sort((a,b)=>b.rem-a.rem);

  const mapped = new Set(ALLTAGS);
  const otherTags = Object.keys(byTag).filter(k=>k!=="__null" && !mapped.has(k));
  if(otherTags.length) cards.push({id:"other", name:"Other / unmapped", loc:"collected tags not in the target sheet", target:null,
    subsC:otherTags.map(k=>({name:k,target:null,got:byTag[k]})), got:otherTags.reduce((a,k)=>a+byTag[k],0), rem:0});
  if(byTag["__null"]) cards.push({id:"untagged", name:"Untagged (FLEX)", loc:"rows with no app_tag — pick a tag when checking FLEX", target:null,
    subsC:[{name:"(no app_tag)",target:null,got:byTag["__null"]}], got:byTag["__null"], rem:0});

  html += `<div class="dashsec">Environments · البيئات</div>`;
  cards.forEach(e=>{
    const open = !!openEnvs[e.id];
    const remTxt = e.target==null ? `${fnum(e.got)}h logged` : e.rem<=0 ? "done ✓" : `${fnum(e.rem)}h left`;
    html += `<div class="envcard">
      <div class="envhead" onclick="toggleEnv('${e.id}')">
        <div><span class="nm">${open?"▾":"▸"} ${e.name}</span><span class="loc">${e.loc}</span></div>
        <div class="hrs">${fnum(e.got)}${e.target!=null?` / ${fnum(e.target)}`:""}h<span class="rem ${e.target!=null&&e.rem<=0?'ok':''}">${remTxt}</span></div>
      </div>`;
    if(e.target!=null) html += `<div class="envwrap"><div class="pbar paper"><i class="${e.got>=e.target?'full':''}" style="width:${Math.min(100, e.got/e.target*100).toFixed(1)}%"></i></div></div>`;
    if(open){
      html += `<table class="subtable"><tr><th>Subtask (app tag)</th><th>Target</th><th>Got</th><th>Left</th></tr>`;
      e.subsC.forEach(s=>{
        const done = s.target!=null && s.got>=s.target;
        html += `<tr class="${done?'ok':''}"><td>${s.name}</td><td>${s.target!=null?fnum(s.target):"—"}</td><td>${fnum(s.got)}</td><td>${s.target!=null?fnum(Math.max(0,s.target-s.got)):"—"}</td></tr>`;
      });
      html += `</table>`;
    }
    html += `</div>`;
  });
  document.getElementById("dash-stats").innerHTML = html;

  document.getElementById("dash-tl").innerHTML = TL.map(t=>`<div class="tlcard">
    <div class="tlh"><span>${t.label} · ${t.ar}</span><span class="got">${fnum(byDay[t.key]||0)}h collected</span></div>
    <ul>${t.items.map(i=>`<li>${i}</li>`).join("")}</ul>
  </div>`).join("");
}

// ---------- QUICK ADD ----------
function qInit(){
  document.getElementById("q-env").innerHTML =
    `<option value="">— pick environment · اختار البيئة —</option>` +
    ENVS.map(e=>`<option value="${e.id}">${e.name}</option>`).join("");
}
function qEnvChange(){
  const e = ENVS.find(x=>x.id===document.getElementById("q-env").value);
  document.getElementById("q-tag").innerHTML =
    `<option value="">— pick task · اختار المهمة —</option>` +
    (e ? e.subs.map(s=>`<option>${s[0]}</option>`).join("") : "");
}
async function qAdd(){
  const env = document.getElementById("q-env").value;
  const tag = document.getElementById("q-tag").value;
  const dayv = document.getElementById("q-day").value;
  const hrs = parseFloat(document.getElementById("q-hours").value);
  const note = document.getElementById("q-note").value.trim();
  const msg = document.getElementById("q-msg");
  msg.style.color = "#E5533C";
  if(!env || !tag){ msg.textContent = "Pick environment + app task · اختار البيئة والمهمة"; return; }
  if(isNaN(hrs) || hrs < 0 || hrs > 12){ msg.textContent = "Hours must be 0–12 · الساعات من ٠ لـ ١٢"; return; }
  const id = "ext-" + env + "-" + Date.now();
  try{
    const r = await fetch(`${SB_URL}/rest/v1/${T}?on_conflict=item_id`, {
      method:"POST",
      headers:{...H, "Prefer":"resolution=merge-duplicates,return=minimal"},
      body: JSON.stringify([{item_id:id, day:dayv, block:"external", person:"external", phone:0, task: tag + (note ? " — " + note : ""), app_tag:tag, checked:true, hours:hrs, checked_by:"external", updated_at:new Date().toISOString()}])
    });
    if(!r.ok) throw new Error(r.status);
    msg.style.color = "var(--gap)";
    msg.textContent = `Added ${fnum(hrs)}h ✓ · اتسجلت`;
    document.getElementById("q-hours").value = "";
    document.getElementById("q-note").value = "";
    loadRemote();
  }catch(e){
    msg.textContent = "Save failed — check connection · فشل الحفظ";
  }
}

// ---------- VIEWS ----------
function setView(v){
  view = v;
  document.getElementById("vw-check").className = v==="checklist" ? "on" : "";
  document.getElementById("vw-dash").className  = v==="dashboard" ? "on" : "";
  document.getElementById("view-checklist").style.display = v==="checklist" ? "" : "none";
  document.getElementById("view-dash").style.display      = v==="dashboard" ? "" : "none";
  renderAll();
}
function renderAll(){ render(); renderDash(); }

qInit();
renderAll();
loadRemote();
setInterval(loadRemote, 30000);
</script>
