<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company report. Company map</title>
<link rel="canonical" href="../../dashboard/">
<link rel="stylesheet" href="../../css/site.css">
<script>
  // The company report and the dashboard are one page now. A link from an old email, or a phone that kept the address, lands here.
  (function () {
    var day = location.hash.replace(/^#\/?/, '');
    location.replace('../../dashboard/' + (/^\d{4}-\d{2}-\d{2}$/.test(day) ? '#' + day : ''));
  })();
</script>
</head>
<body>
<div class="shell">
  <main class="page" id="main">
    <p><a href="../../dashboard/">The company report is part of the dashboard now.</a></p>
  </main>
</div>
</body>
</html>
